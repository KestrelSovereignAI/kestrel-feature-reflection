[project]
name = "kestrel-feature-reflection"
version = "0.4.0"
description = "Agent self-reflection and self-improvement feature for Kestrel Sovereign"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11.5,<3.15"
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    # Reflection uses Core's canonical external-speaker projection and input
    # boundaries, delivered with the native MCP external-exchange contract.
    "kestrel-sovereign>=0.66.1,<1",
    "kestrel-sovereign-sdk>=0.14.1,<1",
    "aiosqlite>=0.21.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.1.0",
    "pytest-timeout>=2.3.1",
]

[project.entry-points."kestrel_sovereign.features"]
ReflectionFeature = "kestrel_feature_reflection:ReflectionFeature"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kestrel_feature_reflection"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
